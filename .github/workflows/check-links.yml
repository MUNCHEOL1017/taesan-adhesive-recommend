name: Check Product Links

on:
  schedule:
    - cron: '0 22 * * 1' # 매주 월요일 07:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check all product/document links
        id: check
        run: node scripts/check-links.mjs
        continue-on-error: true

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link-check-report.json
          git diff --staged --quiet || git commit -m "Update link check report [automated]"
          git push

      - name: Open issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search "링크 점검 실패 in:title" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create --title "🔗 사이트 링크 점검 실패" --body-file link-check-report.json
          fi
