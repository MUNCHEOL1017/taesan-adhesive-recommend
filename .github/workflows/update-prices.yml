name: Update Naver Prices

# 네이버 쇼핑 검색 API 제휴 신청이 반려되어 자격증명이 없는 상태라, 이 스크립트는
# 실행돼도 매번 빈 prices.json만 커밋합니다. 매일 자동 실행되던 schedule 트리거는
# 중지했습니다. 제휴가 승인되면 workflow_dispatch로 수동 실행하거나 schedule을
# 다시 추가하면 됩니다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices from Naver Shopping API
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/fetch-naver-prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update Naver lowest prices [automated]"
          git push
